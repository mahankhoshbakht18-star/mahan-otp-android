name: Staging APK upgrade and SMS checks
on:
  push:
    branches: [feature/typed-otp-updater-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-android:
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend fixtures only
        run: |
          python -m pip install 'fastapi>=0.115,<0.130' 'httpx>=0.27,<0.29'
          python -m unittest relay/test_relay.py relay/test_release_api.py relay/test_migration.py -v
      - name: Kotlin unit tests and Android lint
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Retrieve private staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging-artifacts
          gh release download v2.2.0-rc1 --pattern '*.apk' --dir staging-artifacts
          curl --fail --location --output staging-artifacts/classic-2.1.0.apk https://otp.mahanvip.ir/downloads/mahan-otp-2.1.0.apk
          sha256sum -c qa/candidate.sha256
      - name: Allow KVM in this isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python qa/emulator_upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-reports-and-screenshots-api-${{ matrix.api }}
          path: |
            staging-artifacts/*.png
            staging-artifacts/*results.json
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
